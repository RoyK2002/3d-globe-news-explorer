`html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TerraPulse — Interactive 3D Globe News Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css" />
  <style>
    :root {
      --bg-space: #030712;
      --glass-bg: rgba(9, 15, 29, 0.80);
      --glass-bg-strong: rgba(8, 13, 26, 0.92);
      --glass-border: rgba(148, 163, 184, 0.18);
      --glass-border-hover: rgba(56, 189, 248, 0.42);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-violet: #a855f7;
      --accent-teal: #14b8a6;
      --accent-pink: #ec4899;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-glass: 0 18px 48px rgba(0, 0, 0, 0.55);
      --transition-ui: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-space);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Deep-Space Starfield Backdrop */
    #space-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 22% 28%, rgba(30, 64, 175, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 78% 72%, rgba(14, 165, 233, 0.12) 0%, transparent 48%),
        radial-gradient(ellipse at center, #071024 0%, #030712 72%, #02040a 100%);
      pointer-events: none;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.72;
    }

    /* Fullscreen MapLibre 3D Globe */
    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: transparent;
    }

    .maplibregl-canvas {
      outline: none;
    }

    /* MapLibre Controls Styling */
    .maplibregl-ctrl-top-right {
      top: 116px !important;
      right: 16px !important;
      transition: right var(--transition-ui), top var(--transition-ui);
      z-index: 15;
    }

    body.detail-open .maplibregl-ctrl-top-right {
      right: 416px !important;
    }

    .maplibregl-ctrl-group {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border) !important;
      border-radius: 12px !important;
      box-shadow: var(--shadow-glass) !important;
      overflow: hidden;
    }

    .maplibregl-ctrl-group button {
      width: 34px !important;
      height: 34px !important;
      background-color: transparent !important;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12) !important;
      color: var(--text-primary) !important;
      transition: background-color 0.18s ease;
    }

    .maplibregl-ctrl-group button:last-child {
      border-bottom: none !important;
    }

    .maplibregl-ctrl-group button:hover {
      background-color: rgba(56, 189, 248, 0.16) !important;
    }

    .maplibregl-ctrl-icon {
      filter: invert(1) brightness(1.15);
    }

    .maplibregl-ctrl-attrib {
      background: rgba(6, 11, 23, 0.68) !important;
      color: var(--text-muted) !important;
      font-size: 10px !important;
      border-radius: 8px 0 0 0 !important;
      backdrop-filter: blur(8px);
    }

    .maplibregl-ctrl-attrib a {
      color: var(--text-secondary) !important;
    }

    /* Custom Popups */
    .maplibregl-popup {
      z-index: 25;
      pointer-events: none;
    }

    .maplibregl-popup-content {
      background: var(--glass-bg-strong) !important;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px !important;
      padding: 10px 12px !important;
      color: var(--text-primary) !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6) !important;
      max-width: 260px;
    }

    .maplibregl-popup-tip {
      border-top-color: rgba(8, 13, 26, 0.92) !important;
      border-bottom-color: rgba(8, 13, 26, 0.92) !important;
    }

    /* Clickable City Hub Markers on Globe */
    .city-marker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px 4px 7px;
      border-radius: 999px;
      background: rgba(7, 13, 26, 0.84);
      border: 1px solid rgba(56, 189, 248, 0.38);
      backdrop-filter: blur(10px);
      color: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      white-space: nowrap;
      user-select: none;
    }

    .city-marker:hover,
    .city-marker.active {
      transform: scale(1.08);
      background: rgba(14, 116, 144, 0.9);
      border-color: #7dd3fc;
      z-index: 10;
    }

    .city-marker-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      flex-shrink: 0;
    }

    .city-marker-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
    }

    /* Active Selected Story Pulse Ring */
    .selected-pulse-marker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.95);
      position: relative;
      pointer-events: none;
    }

    .selected-pulse-marker::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.85);
      animation: radarPulse 1.8s infinite ease-out;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.7); opacity: 0.95; }
      100% { transform: scale(1.9); opacity: 0; }
    }

    /* Center Crosshair for Local Auto-Load Mode */
    #center-reticle {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body.local-mode #center-reticle {
      opacity: 0.72;
    }

    /* Top Command Header */
    .top-command-bar {
      position: fixed;
      top: 12px;
      left: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      box-shadow: var(--shadow-glass);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      padding-right: 6px;
    }

    .brand-orb {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 55%, #0ea5e9 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
      position: relative;
    }

    .brand-orb::after {
      content: '';
      position: absolute;
      top: -2px;
      right: -2px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-emerald);
      border: 2px solid #090f1d;
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    .brand-text h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-text span {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Search Box */
    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 11px;
      padding: 0 12px;
      height: 38px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input-box:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
    }

    .search-input-box input::placeholder {
      color: var(--text-muted);
    }

    .clear-search-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      padding: 2px;
      font-size: 16px;
      line-height: 1;
    }

    .clear-search-btn.visible {
      display: block;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.7);
      max-height: 380px;
      overflow-y: auto;
      display: none;
      z-index: 60;
      padding: 6px;
    }

    .search-dropdown.open {
      display: block;
    }

    .search-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 10px 4px;
    }

    .search-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .search-item:hover {
      background: rgba(56, 189, 248, 0.14);
    }

    .search-item-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 13px;
    }

    .search-item-meta {
      min-width: 0;
      flex: 1;
    }

    .search-item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Header Action Buttons */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.68);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .pill-btn:hover {
      border-color: var(--glass-border-hover);
      color: var(--text-primary);
      background: rgba(30, 41, 59, 0.85);
    }

    .pill-btn.active {
      background: rgba(14, 165, 233, 0.2);
      border-color: var(--accent-cyan);
      color: #e0f2fe;
    }

    .saved-count-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.22);
      color: #7dd3fc;
    }

    /* Category Filter Bar */
    .category-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 2px 4px;
      pointer-events: auto;
    }

    .category-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }

    .cat-chip:hover {
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      transform: translateY(-1px);
    }

    .cat-chip.active {
      background: rgba(248, 250, 252, 0.94);
      color: #090f1d;
      border-color: #ffffff;
      font-weight: 600;
    }

    .cat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* Left Feed Panel */
    .left-panel {
      position: fixed;
      top: 116px;
      left: 16px;
      bottom: 16px;
      width: 344px;
      z-index: 20;
      background: var(--glass-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform var(--transition-ui);
    }

    .left-panel.collapsed {
      transform: translateX(calc(-100% - 20px));
    }

    .panel-collapse-fab {
      position: fixed;
      top: 124px;
      left: 16px;
      z-index: 19;
      display: none;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-glass);
    }

    .left-panel.collapsed + .panel-collapse-fab {
      display: inline-flex;
    }

    .panel-tabs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      gap: 8px;
    }

    .tabs-group {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 8px 6px 10px;
      cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
    }

    .icon-btn-sm {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.16s ease;
      margin-bottom: 6px;
    }

    .icon-btn-sm:hover {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-primary);
    }

    /* Local Radar Status Banner inside Left Panel */
    .radar-status-strip {
      padding: 9px 14px;
      background: rgba(14, 165, 233, 0.1);
      border-bottom: 1px solid rgba(56, 189, 248, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }

    .radar-status-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .live-pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      flex-shrink: 0;
      animation: blinkSoft 2s infinite;
    }

    @keyframes blinkSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .feed-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.25) transparent;
    }

    .story-card {
      background: rgba(15, 23, 42, 0.56);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .story-card:hover {
      background: rgba(30, 41, 59, 0.78);
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    .story-card.selected {
      background: rgba(14, 116, 144, 0.22);
      border-color: var(--accent-cyan);
    }

    .story-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .badge-cat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .story-loc {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .story-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13.8px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .story-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      gap: 8px;
    }

    .bookmark-mini-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .bookmark-mini-btn:hover {
      color: var(--accent-amber);
      transform: scale(1.12);
    }

    .bookmark-mini-btn.saved {
      color: var(--accent-amber);
    }

    /* Right Regional News Detail Panel */
    .detail-panel {
      position: fixed;
      top: 116px;
      right: 16px;
      bottom: 16px;
      width: 386px;
      z-index: 22;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(calc(100% + 28px));
      transition: transform var(--transition-ui);
    }

    body.detail-open .detail-panel {
      transform: translateX(0);
    }

    .detail-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.55);
    }

    .detail-location-block {
      min-width: 0;
    }

    .detail-location-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .detail-coords {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.25) transparent;
    }

    .detail-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .detail-headline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -0.015em;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .detail-source-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.52);
      border: 1px solid rgba(148, 163, 184, 0.14);
      font-size: 12px;
      margin-bottom: 14px;
    }

    .detail-summary {
      font-size: 13.8px;
      line-height: 1.65;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    .detail-takeaways {
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .detail-takeaways h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-cyan);
      margin-bottom: 8px;
    }

    .detail-takeaways ul {
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      line-height: 1.48;
      color: var(--text-secondary);
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.65);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .action-btn:hover {
      border-color: var(--accent-cyan);
      background: rgba(14, 165, 233, 0.18);
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: transparent;
      color: #ffffff;
    }

    .action-btn.primary:hover {
      filter: brightness(1.1);
    }

    .action-btn.saved {
      border-color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
    }

    .regional-list-section {
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding-top: 14px;
    }

    .regional-list-section h4 {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .regional-mini-card {
      padding: 10px 11px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.56);
      border: 1px solid rgba(148, 163, 184, 0.14);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .regional-mini-card:hover {
      border-color: var(--accent-cyan);
      background: rgba(30, 41, 59, 0.72);
    }

    /* Bottom Telemetry & Quick-Jump Bar */
    .bottom-hud {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 16;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: var(--shadow-glass);
      max-width: calc(100vw - 32px);
    }

    .hud-telemetry {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(148, 163, 184, 0.22);
    }

    .quick-cities {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .quick-cities::-webkit-scrollbar {
      display: none;
    }

    .quick-city-btn {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .quick-city-btn:hover {
      border-color: var(--accent-cyan);
      color: #fff;
      background: rgba(14, 165, 233, 0.22);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 80;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Full Dispatch Reader Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      background: #0b1222;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.75);
    }

    /* Mobile Bottom Sheet Controls (Hidden on Desktop) */
    .mobile-sheet-bar {
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 900px) {
      .top-command-bar {
        top: 8px;
        left: 10px;
        right: 10px;
        gap: 6px;
      }

      .header-row {
        flex-wrap: wrap;
        padding: 8px 10px;
        gap: 8px;
      }

      .brand-text span {
        display: none;
      }

      .search-wrapper {
        order: 3;
        flex: 1 0 100%;
        max-width: none;
      }

      .pill-btn .btn-label-hide-sm {
        display: none;
      }

      .maplibregl-ctrl-top-right {
        top: 152px !important;
        right: 10px !important;
      }

      body.detail-open .maplibregl-ctrl-top-right {
        right: 10px !important;
      }

      .bottom-hud {
        display: none;
      }

      .panel-collapse-fab {
        display: none !important;
      }

      /* Mobile Unified Bottom Sheet for Left Panel */
      .left-panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 44vh;
        min-height: 54px;
        max-height: 76vh;
        border-radius: 20px 20px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        transform: translateY(0);
        transition: height var(--transition-ui), transform var(--transition-ui);
      }

      .left-panel.mobile-minimized {
        height: 56px;
      }

      .left-panel.mobile-expanded {
        height: 74vh;
      }

      .mobile-sheet-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px 4px;
        cursor: pointer;
        user-select: none;
      }

      .sheet-handle {
        width: 40px;
        height: 4px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.45);
        margin: 0 auto;
      }

      /* Detail panel slides up over bottom sheet on mobile */
      .detail-panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 72vh;
        border-radius: 20px 20px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        transform: translateY(105%);
      }

      body.detail-open .detail-panel {
        transform: translateY(0);
      }

      .desktop-collapse-btn {
        display: none;
      }
    }
  </style>
</head>

    // =========================================================================

    (function initStarfield() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = Math.min(260, Math.floor((canvas.width * canvas.height) / 6800));
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.25 + 0.25,
          a: Math.random() * 0.65 + 0.2,
          tw: Math.random() * 0.015 + 0.004
        }));
      }

      let t = 0;
      function draw() {
        t += 1;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const alpha = s.a * (0.65 + 0.35 * Math.sin(t * s.tw + s.x));
          ctx.fillStyle = `rgba(226, 232, 240, ${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();

    // =========================================================================
    // 4. GEOGRAPHIC & UTILITY HELPERS

    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const toRad = d => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function formatCoords(lat, lng) {
      const latDir = lat >= 0 ? 'N' : 'S';
      const lngDir = lng >= 0 ? 'E' : 'W';
      return `${Math.abs(lat).toFixed(2)}° ${latDir}, ${Math.abs(lng).toFixed(2)}° ${lngDir}`;
    }

    function escapeHtml(str = '') {

      if (/market|trade|bank|economy|stock|inflation|port|freight|finance|gdp/.test(t)) return 'economy';
      if (/space|rocket|nasa|telescope|genome|physics|science|orbit|satellite/.test(t)) return 'science';
      if (/health|hospital|vaccine|disease|medical|clinic|virus|cancer/.test(t)) return 'health';
      if (/museum|film|music|art|festival|culture|heritage|sport/.test(t)) return 'culture';
      return 'world';

    // =========================================================================
    // 5. MAPLIBRE 3D GLOBE INITIALIZATION (SATELLITE + MULTI-ZOOM VECTOR)
    // =========================================================================
    function buildHybridStyle(nextStyle, mode) {
      nextStyle.projection = { type: 'globe' };
      nextStyle.sky = {
        'atmosphere-blend': [
          'interpolate',
          ['linear'],
          ['zoom'],
          0, 1,
          5, 1,
          7, 0
        ]
      };
      nextStyle.light = {
        anchor: 'map',
        position: [1.5, 90, 80]
      };

      if (mode === 'satellite') {
        nextStyle.sources = {
          ...(nextStyle.sources || {}),
          satelliteSource: {
            type: 'raster',
            tiles: [
              'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'
            ],
            tileSize: 256,
            maxzoom: 14,
            attribution: '© EOX Sentinel-2 Cloudless'
          }
        };

        const styledLayers = [];
        let insertedSat = false;

        for (const layer of nextStyle.layers || []) {
          const isBoundary = layer['source-layer'] === 'boundary';
          const isTransport = layer['source-layer'] === 'transportation';
          const isWaterway = layer['source-layer'] === 'waterway';
          const isSymbol = layer.type === 'symbol';
          const isBuilding = layer['source-layer'] === 'building';

          // Insert Satellite raster layer right before vector borders/roads/labels
          if (!insertedSat && (isBoundary || isTransport || isSymbol)) {
            styledLayers.push({
              id: 'eox-satellite-base',
              type: 'raster',
              source: 'satelliteSource',
              minzoom: 0,
              maxzoom: 22,
              paint: {
                'raster-opacity': 1,
                'raster-contrast': 0.08,
                'raster-saturation': 0.1
              }
            });
            insertedSat = true;
          }

          // Hide opaque polygon fills so real satellite imagery shows through cleanly
          if (layer.type === 'background' || layer.type === 'fill' || layer.type === 'hillshade') {
            if (isBuilding) {
              layer.paint = {
                ...(layer.paint || {}),
                'fill-color': 'rgba(203, 213, 225, 0.16)',
                'fill-outline-color': 'rgba(226, 232, 240, 0.25)'
              };
              styledLayers.push(layer);
            }
            continue;
          }

          if (isBoundary && layer.type === 'line') {
            layer.paint = {
              ...(layer.paint || {}),
              'line-color': 'rgba(226, 232, 240, 0.42)'
            };
          }

          if (isTransport && layer.type === 'line') {
            layer.paint = {
              ...(layer.paint || {}),
              'line-color': 'rgba(248, 250, 252, 0.28)'
            };
          }

          if (isWaterway && layer.type === 'line') {
            layer.paint = {
              ...(layer.paint || {}),
              'line-color': 'rgba(56, 189, 248, 0.35)'
            };
          }

          if (isSymbol) {
            const isWaterLabel =
              layer['source-layer'] === 'water_name' ||
              (layer.id && layer.id.toLowerCase().includes('water'));
            layer.paint = {
              ...(layer.paint || {}),
              'text-color': isWaterLabel ? '#93c5fd' : '#f8fafc',
              'text-halo-color': 'rgba(3, 7, 18, 0.92)',
              'text-halo-width': 1.5,
              'text-halo-blur': 0.5
            };
          }

          styledLayers.push(layer);
        }

        if (!insertedSat) {
          styledLayers.unshift({
            id: 'eox-satellite-base',
            type: 'raster',
            source: 'satelliteSource'
          });
        }
        nextStyle.layers = styledLayers;
      }

      return nextStyle;
    }

    function getPlaceFromMapFeatures() {

        const canvas = map.getCanvas();
        const cx = canvas.clientWidth / 2;
        const cy = canvas.clientHeight / 2;
        const box = [
          [cx - 80, cy - 80],

        const features = map.queryRenderedFeatures(box);
        for (const f of features) {
          if (
            f.layer &&
            f.layer['source-layer'] === 'place' &&
            f.properties &&
            (f.properties.name_en || f.properties.name)
          ) {
            return f.properties.name_en || f.properties.name;
          }
        }
      } catch (_) {
        // Ignore query error while style transitions
      }
      return null;
    }

    async function reverseGeocodeCenter(lat, lng) {
      const key = `${lat.toFixed(1)},${lng.toFixed(1)}`;
      if (reverseGeoCache.has(key)) return reverseGeoCache.get(key);

      const now = Date.now();
      if (now - lastNominatimTime < 1100) {
        return null;
      }
      lastNominatimTime = now;

      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat.toFixed(4)}&lon=${lng.toFixed(4)}&zoom=10&accept-language=en`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) return null;
        const data = await res.json();
        if (!data || data.error || !data.address) return null;

        const addr = data.address;
        const city =
          addr.city ||
          addr.town ||
          addr.village ||
          addr.municipality ||
          addr.county ||
          addr.state_district ||
          addr.state;
        const country = addr.country || '';
        const placeObj = {
          city: city || country || 'Regional Area',
          country,
          displayName: city && country && city !== country ? `${city}, ${country}` : (city || country)
        };
        reverseGeoCache.set(key, placeObj);
        return placeObj;
      } catch (_) {
        return null;
      }
    }

    async function fetchGDELTLocalNews(placeQuery, cityName, countryName, centerLat, centerLng) {
      const cacheKey = placeQuery.toLowerCase();
      const cached = gdeltCache.get(cacheKey);
      if (cached && Date.now() - cached.ts < 5 * 60 * 1000) {
        return cached.articles;
      }

      try {
        const url = `https://api.gdeltproject.org/api/v2/doc/doc?query=${encodeURIComponent(`"${placeQuery}"`)}&mode=artlist&maxrecords=6&format=json&timespan=7d&sourcelang=english`;
        const res = await fetch(url);
        if (!res.ok) return [];
        const rawText = await res.text();
        if (!rawText || !rawText.trim().startsWith('{')) return [];
        const json = JSON.parse(rawText);
        const articles = Array.isArray(json.articles) ? json.articles : [];

        const normalized = articles.slice(0, 5).map((art, idx) => {
          // Slight spatial offset around center so live local dots are individually clickable
          const angle = (idx * 72 * Math.PI) / 180;
          const jitter = 0.045 + idx * 0.012;
          const cat = inferCategoryFromText(art.title || '');
          return {
            id: `live-${cacheKey.replace(/\W+/g, '-')}-${idx}`,
            title: art.title || `Local Update from ${cityName}`,
            city: cityName,
            country: countryName || 'Regional Dispatch',
            lng: centerLng + Math.cos(angle) * jitter,
            lat: centerLat + Math.sin(angle) * jitter * 0.75,
            category: cat,
            source: art.domain || 'GDELT Global Wire',
            publishedAt: 'Live Dispatch',
            trendingScore: 80 - idx,
            summary: `Live regional dispatch indexed near ${cityName}${countryName ? ', ' + countryName : ''} via ${art.domain || 'international wire'}. Click "Open Original Source" below to read the full publication.`,
            takeaways: [
              `Automatically geo-loaded for map center (${centerLat.toFixed(2)}°, ${centerLng.toFixed(2)}°).`,
              `Published by ${art.domain || 'regional newsroom'}.`
            ],
            fullText: `This live local dispatch was dynamically retrieved for ${cityName}${countryName ? ', ' + countryName : ''} when zooming into this region on the 3D globe.`,
            url: art.url,
            isLive: true
          };
        });

        gdeltCache.set(cacheKey, { ts: Date.now(), articles: normalized });
        return normalized;
      } catch (_) {
        return [];
      }
    }

    async function loadLocalNewsForCenter(center, zoom) {
      if (zoom < LOCAL_ZOOM_THRESHOLD) {
        document.body.classList.remove('local-mode');
        state.localPlaceName = null;
        updateRadarBanner();
        return;
      }

      document.body.classList.add('local-mode');
      state.localLoading = true;
      updateRadarBanner();

      // 1. Instant nearest gazetteer / map-feature guess for zero-latency UI
      let featurePlace = getPlaceFromMapFeatures();
      let nearestGaz = null;
      let minDist = Infinity;
      for (const g of GAZETTEER) {
        const d = haversineKm(center.lat, center.lng, g.lat, g.lng);
        if (d < minDist) {
          minDist = d;
          nearestGaz = g;
        }
      }

      let resolvedCity = featurePlace || (minDist < 220 ? nearestGaz.name : 'Regional Sector');
      let resolvedCountry = minDist < 300 ? nearestGaz.country : '';

      // 2. Enrich with live OpenStreetMap Nominatim reverse-geocoding
      const geo = await reverseGeocodeCenter(center.lat, center.lng);
      if (geo) {
        resolvedCity = geo.city;
        resolvedCountry = geo.country;
        state.localPlaceName = geo.displayName;
      } else {
        state.localPlaceName = resolvedCountry && resolvedCity !== resolvedCountry
          ? `${resolvedCity}, ${resolvedCountry}`
          : resolvedCity;
      }

      updateRadarBanner();

      // 3. Query live GDELT local news if we have a real place name
      if (resolvedCity && resolvedCity !== 'Regional Sector') {
        const queryTerm = resolvedCountry ? `${resolvedCity}` : resolvedCity;
        const liveStories = await fetchGDELTLocalNews(
          queryTerm,
          resolvedCity,
          resolvedCountry,
          center.lat,
          center.lng
        );
        state.liveLocalStories = liveStories;
        syncNewsGeoJSON();
      }

      state.localLoading = false;
      updateRadarBanner();
      renderFeed();
    }

    function updateRadarBanner() {
      const textEl = document.getElementById('radar-status-text');
      const dotEl = document.getElementById('radar-dot');
      const zoom = map.getZoom();

      if (zoom < LOCAL_ZOOM_THRESHOLD) {
        dotEl.style.background = '#38bdf8';
        dotEl.style.boxShadow = '0 0 8px #38bdf8';
        textEl.textContent = `Global View (z${zoom.toFixed(1)}) • Zoom ≥5.2 for auto local news`;
      } else if (state.localLoading) {
        dotEl.style.background = '#f59e0b';
        dotEl.style.boxShadow = '0 0 8px #f59e0b';
        textEl.textContent = `Scanning local news near ${state.localPlaceName || 'map center'}...`;
      } else {
        dotEl.style.background = '#10b981';
        dotEl.style.boxShadow = '0 0 8px #10b981';
        textEl.textContent = `Local Radar: ${state.localPlaceName || 'Active Region'}`;
      }
    }

    function updateTelemetryHUD() {
      const c = map.getCenter();
      const z = map.getZoom();
      state.center = { lng: c.lng, lat: c.lat };
      state.zoom = z;

      document.getElementById('hud-coords').textContent = formatCoords(c.lat, c.lng);
      document.getElementById('hud-zoom').textContent = `z${z.toFixed(1)}`;
      document.getElementById('mobile-peek-zoom').textContent = `z${z.toFixed(1)}`;
      updateRadarBanner();
    }

    map.on('move', updateTelemetryHUD);
    map.on('moveend', () => {
      updateTelemetryHUD();
      clearTimeout(localFetchTimer);
      localFetchTimer = setTimeout(() => {
        loadLocalNewsForCenter(map.getCenter(), map.getZoom());
      }, 360);
    });

    // =========================================================================
    function renderCategories() {
      const container = document.getElementById('category-bar');
      const allStories = getAllStories();
      container.innerHTML = CATEGORIES.map(cat => {
        const count =
          cat.id === 'all'
            ? allStories.length
            : allStories.filter(s => s.category === cat.id).length;
        const activeClass = state.activeCategory === cat.id ? 'active' : '';
        return `
          <button class="cat-chip ${activeClass}" data-cat="${cat.id}">
            <span class="cat-dot" style="background:${cat.color};"></span>
            <span>${escapeHtml(cat.label)}</span>
            <span style="opacity:0.65; font-size:10.5px;">${count}</span>
          </button>
        `;
      }).join('');

      container.querySelectorAll('.cat-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeCategory = btn.dataset.cat;
          renderCategories();
          syncNewsGeoJSON();
          renderCityMarkers();
          renderFeed();
        });
      });
    }

    function getFeedStoriesForActiveTab() {
      const filtered = getFilteredStories();
      const c = map.getCenter();

      if (state.activeTab === 'saved') {
        return filtered.filter(s => state.savedIds.has(s.id));
      }

      if (state.activeTab === 'local') {
        return [...filtered]
          .map(s => ({
            ...s,
            _distKm: Math.round(haversineKm(c.lat, c.lng, s.lat, s.lng))
          }))
          .sort((a, b) => {
            // Prioritize live center-fetched dispatches when zoomed in, then closest distance
            if (a.isLive && !b.isLive && a._distKm < 250) return -1;
            if (!a.isLive && b.isLive && b._distKm < 250) return 1;
            return a._distKm - b._distKm;
          })
          .slice(0, 18);
      }

      // Trending tab
      return [...filtered].sort((a, b) => (b.trendingScore || 0) - (a.trendingScore || 0));
    }

    function renderFeed() {
      const listEl = document.getElementById('feed-list');
      const stories = getFeedStoriesForActiveTab();
      document.getElementById('feed-count-pill').textContent = `${stories.length} items`;

      if (stories.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            ${state.activeTab === 'saved'
              ? 'No saved stories yet.<br/>Click the bookmark icon on any dispatch to save it here.'
              : 'No stories match this topic filter.'}
          </div>
        `;
        return;
      }

      listEl.innerHTML = stories.map(s => {
        const cat = CATEGORY_MAP[s.category] || CATEGORY_MAP.world;
        const isSaved = state.savedIds.has(s.id);
        const isSelected = state.selectedStoryId === s.id;
        const distBadge = typeof s._distKm === 'number' ? ` • ${s._distKm.toLocaleString()} km` : '';
        const liveTag = s.isLive
          ? `<span style="color:#10b981; font-weight:600;">● LIVE</span>`
          : escapeHtml(s.publishedAt);

        return `
          <article class="story-card ${isSelected ? 'selected' : ''}" data-story-id="${escapeHtml(s.id)}">
            <div class="story-card-top">
              <span class="badge-cat" style="background:${cat.color}22; color:${cat.color}; border:1px solid ${cat.color}44;">
                ${escapeHtml(cat.label)}
              </span>
              <span class="story-loc">${escapeHtml(s.city)}${distBadge}</span>
            </div>
            <h3 class="story-card-title">${escapeHtml(s.title)}</h3>
            <div class="story-card-foot">
              <span>${escapeHtml(s.source)} • ${liveTag}</span>
              <button class="bookmark-mini-btn ${isSaved ? 'saved' : ''}" data-save-id="${escapeHtml(s.id)}" title="${isSaved ? 'Remove bookmark' : 'Save story'}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
            </div>
          </article>
        `;
      }).join('');

      listEl.querySelectorAll('.story-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('.bookmark-mini-btn')) return;
          const story = getAllStories().find(x => x.id === card.dataset.storyId);
          if (story) {
            stopAutoRotate();
            selectStory(story, { zoom: Math.max(map.getZoom(), 5.6) });
          }
        });
      });

      listEl.querySelectorAll('.bookmark-mini-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggleSaveStory(btn.dataset.saveId);
        });
      });
    }

    function updateSavedBadges() {
      const count = state.savedIds.size;
      document.getElementById('saved-badge').textContent = count;
      document.getElementById('tab-saved-count').textContent = count;
    }

    function toggleSaveStory(storyId) {
      if (state.savedIds.has(storyId)) {
        state.savedIds.delete(storyId);
        showToast('Removed from Saved Stories');
      } else {
        state.savedIds.add(storyId);
        showToast('Story saved to your reading list');
      }
      localStorage.setItem(SAVED_STORAGE_KEY, JSON.stringify([...state.savedIds]));
      updateSavedBadges();
      renderFeed();
      if (state.selectedStoryId === storyId) {
        const s = getAllStories().find(x => x.id === storyId);
        if (s) renderDetailPanel(s);
      }
    }

    function selectStory(story, opts = {}) {
      state.selectedStoryId = story.id;
      state.selectedCityName = story.city;
      document.body.classList.add('detail-open');

      updateSelectedPulseMarker(story);
      renderCityMarkers();
      renderDetailPanel(story);
      renderFeed();

      const targetZoom = opts.zoom ?? Math.max(map.getZoom(), 5.5);
      flyToLocation(story.lng, story.lat, targetZoom);
    }

    function selectCityHub(hub) {
      state.selectedCityName = hub.name;
      const cityStories = getFilteredStories().filter(
        s => s.city.toLowerCase() === hub.name.toLowerCase()
      );
      if (cityStories.length > 0) {
        selectStory(cityStories[0], { zoom: 6.4 });
      } else {
        // If category filter hides stories in this city, show nearest story and still fly there
        flyToLocation(hub.lng, hub.lat, 6.4);
        renderCityMarkers();
        showToast(`Exploring ${hub.name}, ${hub.country}`);
      }
    }

    function renderDetailPanel(story) {
      const cat = CATEGORY_MAP[story.category] || CATEGORY_MAP.world;
      const isSaved = state.savedIds.has(story.id);

      document.getElementById('detail-location-name').textContent =
        story.country && story.city !== story.country
          ? `${story.city}, ${story.country}`
          : story.city;
      document.getElementById('detail-coords').textContent = formatCoords(story.lat, story.lng);

      // Regional nearby dispatches
      const nearby = getAllStories()
        .filter(s => s.id !== story.id)
        .map(s => ({ ...s, dist: haversineKm(story.lat, story.lng, s.lat, s.lng) }))

        .slice(0, 4);

      const detailBody = document.getElementById('detail-body');
      detailBody.innerHTML = `

          </span>
          <span style="font-size:11.5px; color:var(--text-muted);">
            ${escapeHtml(story.publishedAt)}
          </span>
          ${story.isLive ? `<span style="font-size:10.5px; color:#10b981; font-weight:700;">● LIVE FEED</span>` : ''}
        </div>

        <h2 class="detail-headline">${escapeHtml(story.title)}</h2>

        <div class="detail-source-bar">
          <div>
            <span style="color:var(--text-muted);">Source:</span>
            <strong style="color:var(--text-primary); margin-left:4px;">${escapeHtml(story.source)}</strong>
          </div>
          <span style="font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--accent-cyan);">
            ${escapeHtml(story.city)}
          </span>
        </div>

        <p class="detail-summary">${escapeHtml(story.summary)}</p>

        ${story.takeaways && story.takeaways.length ? `
          <div class="detail-takeaways">
            <h4>Key Takeaways</h4>
            <ul>
              ${story.takeaways.map(t => `<li>${escapeHtml(t)}</li>`).join('')}

        <div class="detail-actions">
          <button class="action-btn ${isSaved ? 'saved' : ''}" id="detail-save-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>${isSaved ? 'Saved' : 'Save Story'}</span>
          </button>

          ${story.url ? `
            <a class="action-btn primary" href="${escapeHtml(story.url)}" target="_blank" rel="noopener noreferrer">
              <span>Read Source ↗</span>

            <button class="action-btn primary" id="detail-read-modal-btn">
              <span>Full Dispatch</span>

        <div class="regional-list-section">
          <h4>Regional &amp; Nearby Dispatches</h4>
          ${nearby.map(n => {
            const nc = CATEGORY_MAP[n.category] || CATEGORY_MAP.world;
            return `
              <div class="regional-mini-card" data-nearby-id="${escapeHtml(n.id)}">
                <div style="display:flex; justify-content:space-between; font-size:10.5px; margin-bottom:4px;">
                  <span style="color:${nc.color}; font-weight:600;">${escapeHtml(nc.label)}</span>
                  <span style="color:var(--text-muted);">${escapeHtml(n.city)} • ${Math.round(n.dist).toLocaleString()} km</span>
                </div>
                <div style="font-size:12.5px; font-weight:600; line-height:1.35; color:var(--text-primary);">

      document.getElementById('detail-save-btn').addEventListener('click', () => {

    function openDispatchModal(story) {
      const cat = CATEGORY_MAP[story.category] || CATEGORY_MAP.world;
      const badge = document.getElementById('modal-badge');
      badge.textContent = cat.label;
      badge.style.background = `${cat.color}24`;

      badge.style.border = `1px solid ${cat.color}55`;

      document.getElementById('modal-title').textContent = story.title;
      document.getElementById('modal-meta').textContent =
        `${story.city}, ${story.country} • ${story.source} • ${story.publishedAt} • ${formatCoords(story.lat, story.lng)}`;

      document.getElementById('modal-content').innerHTML = `
        <p>${escapeHtml(story.summary)}</p>
        <p>${escapeHtml(story.fullText || '')}</p>
      `;

      document.getElementById('modal-footer').innerHTML = `
        <span style="font-size:11.5px; color:var(--text-muted);">TerraPulse Geo-Verified Dispatch</span>
        <button class="pill-btn" id="modal-fly-btn">Center Globe on Pin</button>
      `;

      document.getElementById('modal-fly-btn').addEventListener('click', () => {
        document.getElementById('dispatch-modal').classList.remove('open');

    // =========================================================================
    // 10. LIVE LOCATION & STORY SEARCH (GAZETTEER + PHOTON GEOCODER)
    // =========================================================================
    const searchInput = document.getElementById('search-input');
    const searchDropdown = document.getElementById('search-dropdown');
    const clearSearchBtn = document.getElementById('clear-search');

    async function runSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        searchDropdown.classList.remove('open');
        return;
      }

      // Local gazetteer matches
      const localPlaces = GAZETTEER.filter(
        p => p.name.toLowerCase().includes(q) || p.country.toLowerCase().includes(q)
      ).slice(0, 4);

      // Story matches
      const storyMatches = getAllStories().filter(
        s =>
          s.title.toLowerCase().includes(q) ||
          s.city.toLowerCase().includes(q) ||
          s.country.toLowerCase().includes(q) ||
          s.source.toLowerCase().includes(q) ||
          s.category.toLowerCase().includes(q)
      ).slice(0, 5);

      renderSearchDropdown(localPlaces, storyMatches, []);

      // Live Photon OpenStreetMap geocoding for any city/town worldwide
      if (q.length >= 2) {
        try {
          const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=4&lang=en`);
          if (res.ok) {
            const data = await res.json();
            const remotePlaces = (data.features || []).map(f => ({
              name: f.properties.name || f.properties.city || query,
              country: [f.properties.state, f.properties.country].filter(Boolean).join(', '),
              lng: f.geometry.coordinates[0],
              lat: f.geometry.coordinates[1]
            }));
            if (searchInput.value.trim().toLowerCase() === q) {
              renderSearchDropdown(localPlaces, storyMatches, remotePlaces);
            }
          }
        } catch (_) {
          // Offline or blocked; local matches still show seamlessly
        }
      }
    }

    function renderSearchDropdown(localPlaces, storyMatches, remotePlaces) {
      const combinedPlaces = [...localPlaces];
      for (const rp of remotePlaces) {
        if (!combinedPlaces.some(lp => lp.name.toLowerCase() === rp.name.toLowerCase())) {
          combinedPlaces.push(rp);
        }
      }

      if (combinedPlaces.length === 0 && storyMatches.length === 0) {
        searchDropdown.innerHTML = `<div class="empty-state" style="padding:18px;">No matching locations or dispatches found.</div>`;
        searchDropdown.classList.add('open');
        return;
      }

      let html = '';
      if (combinedPlaces.length > 0) {
        html += `<div class="search-section-label">Locations &amp; Cities</div>`;
        html += combinedPlaces.slice(0, 5).map((p, idx) => `
          <div class="search-item" data-place-idx="${idx}">
            <div class="search-item-icon">📍</div>
            <div class="search-item-meta">
              <div class="search-item-title">${escapeHtml(p.name)}</div>
              <div class="search-item-sub">${escapeHtml(p.country)} • ${formatCoords(p.lat, p.lng)}</div>
            </div>
          </div>
        `).join('');
      }

      if (storyMatches.length > 0) {
        html += `<div class="search-section-label">News Dispatches</div>`;
        html += storyMatches.map(s => `
          <div class="search-item" data-story-id="${escapeHtml(s.id)}">
            <div class="search-item-icon">📰</div>
            <div class="search-item-meta">
              <div class="search-item-title">${escapeHtml(s.title)}</div>
              <div class="search-item-sub">${escapeHtml(s.city)}, ${escapeHtml(s.country)} • ${escapeHtml(s.source)}</div>
            </div>
          </div>
        `).join('');
      }

      searchDropdown.innerHTML = html;
      searchDropdown.classList.add('open');

      searchDropdown.querySelectorAll('[data-place-idx]').forEach(el => {
        el.addEventListener('click', () => {
          const place = combinedPlaces[Number(el.dataset.placeIdx)];
          searchDropdown.classList.remove('open');
          stopAutoRotate();
          flyToLocation(place.lng, place.lat, 7.2);
          state.activeTab = 'local';
          syncTabButtons();
          showToast(`Flying to ${place.name} • Loading local news`);
        });
      });

      searchDropdown.querySelectorAll('[data-story-id]').forEach(el => {
        el.addEventListener('click', () => {
          const story = getAllStories().find(s => s.id === el.dataset.storyId);
          searchDropdown.classList.remove('open');
          if (story) {
            stopAutoRotate();
            selectStory(story, { zoom: 6.4 });
          }
        });
      });
    }

    searchInput.addEventListener('input', () => {
      const val = searchInput.value;
      clearSearchBtn.classList.toggle('visible', val.length > 0);
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => runSearch(val), 200);
    });

    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim()) runSearch(searchInput.value);
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.remove('visible');
      searchDropdown.classList.remove('open');
      searchInput.focus();
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrapper')) {
        searchDropdown.classList.remove('open');
      }
    });

    // =========================================================================
    // 11. EVENT WIRING & INITIAL RENDER
    // =========================================================================
    function syncTabButtons() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
      });
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        syncTabButtons();
        renderFeed();
      });
    });

    document.getElementById('btn-saved-header').addEventListener('click', () => {
      state.activeTab = 'saved';
      syncTabButtons();
      document.getElementById('left-panel').classList.remove('collapsed');
      renderFeed();
      if (window.innerWidth <= 900) {
        const lp = document.getElementById('left-panel');
        lp.classList.remove('mobile-minimized');
        lp.classList.add('mobile-expanded');
      }
    });

    document.getElementById('btn-basemap').addEventListener('click', () => {
      state.basemapMode = state.basemapMode === 'satellite' ? 'vector' : 'satellite';
      const isSat = state.basemapMode === 'satellite';
      document.getElementById('basemap-label').textContent = isSat ? 'Satellite' : 'Vector';
      document.getElementById('btn-basemap').classList.toggle('active', isSat);
      loadMapStyle(state.basemapMode);
      showToast(isSat ? 'Switched to Satellite Hybrid Globe' : 'Switched to Vector Atlas Globe');
    });

    document.getElementById('btn-orbit').addEventListener('click', () => {
      state.autoRotate = !state.autoRotate;
      document.getElementById('btn-orbit').classList.toggle('active', state.autoRotate);
      if (state.autoRotate) {
        if (map.getZoom() > 3.5) {
          map.flyTo({ zoom: 1.9, pitch: 8, duration: 900 });
        }
        stepOrbit();
        showToast('Planetary spin enabled (drag anywhere to pause)');
      } else {
        if (orbitFrame) cancelAnimationFrame(orbitFrame);
      }
    });

    document.getElementById('brand-reset').addEventListener('click', () => {
      stopAutoRotate();
      document.body.classList.remove('detail-open');
      state.selectedStoryId = null;
      state.selectedCityName = null;
      updateSelectedPulseMarker(null);
      renderCityMarkers();
      renderFeed();
      map.flyTo({ center: [18, 22], zoom: 1.85, pitch: 8, bearing: 0, duration: 1400, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
    });

    document.getElementById('btn-collapse-left').addEventListener('click', () => {
      document.getElementById('left-panel').classList.add('collapsed');
    });

    document.getElementById('btn-expand-left').addEventListener('click', () => {
      document.getElementById('left-panel').classList.remove('collapsed');
    });

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.body.classList.remove('detail-open');
      state.selectedStoryId = null;
      updateSelectedPulseMarker(null);
      renderFeed();
    });

    document.getElementById('btn-fly-detail').addEventListener('click', () => {
      const s = getAllStories().find(x => x.id === state.selectedStoryId);
      if (s) flyToLocation(s.lng, s.lat, 11.5);
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('dispatch-modal').classList.remove('open');
    });

    document.getElementById('dispatch-modal').addEventListener('click', e => {
      if (e.target.id === 'dispatch-modal') {
        document.getElementById('dispatch-modal').classList.remove('open');
      }
    });

    // Mobile Bottom Sheet Toggle
    document.getElementById('mobile-sheet-toggle').addEventListener('click', () => {
      const lp = document.getElementById('left-panel');
      const chev = document.getElementById('mobile-sheet-chevron');
      if (lp.classList.contains('mobile-expanded')) {
        lp.classList.remove('mobile-expanded');
        lp.classList.add('mobile-minimized');
        chev.textContent = '▲';
      } else if (lp.classList.contains('mobile-minimized')) {
        lp.classList.remove('mobile-minimized');
        chev.textContent = '▲';
      } else {
        lp.classList.add('mobile-expanded');
        chev.textContent = '▼';
      }
    });

    // Quick-Jump Cities in Bottom HUD
    function renderQuickCities() {
      const picks = ['New York', 'London', 'New Delhi', 'Nairobi', 'Tokyo', 'São Paulo', 'Sydney'];
      const container = document.getElementById('quick-cities');
      container.innerHTML = picks.map(name => `
        <button class="quick-city-btn" data-hub-name="${escapeHtml(name)}">${escapeHtml(name)}</button>
      `).join('');

      container.querySelectorAll('.quick-city-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const hub = CITY_HUBS.find(h => h.name === btn.dataset.hubName);
          if (hub) {
            stopAutoRotate();
            selectCityHub(hub);
          }
        });
      });
    }

    // Boot
    renderCategories();
    renderQuickCities();
    updateSavedBadges();
    renderFeed();
    updateTelemetryHUD();
  </script>
</body>
</html>
